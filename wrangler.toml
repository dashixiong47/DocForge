name = "docforge"
main = "src/index.ts"
compatibility_date = "2025-03-03"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "docforge-db"
database_id = "local-dev"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "docforge-media"

# 默认变量（会被根目录 .dev.vars 覆盖用于本地开发）
# 生产环境请用: wrangler secret put ADMIN_PASSWORD
[vars]
JWT_SECRET = "change-me-in-production"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin123"
SITE_TITLE = "DocForge"
SITE_DOMAIN = ""

[dev]
port = 8787
