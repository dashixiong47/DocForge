name = "docforge"
main = "src/index.ts"
compatibility_date = "2025-03-03"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./public", binding = "ASSETS" }

[observability]
enabled = true

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "docforge-db"
database_id = "b251fceb-5de2-4934-9a1c-684f26022d2b"

[[kv_namespaces]]
binding = "KV"
id = "4f9ed277a7894430866e015c1030fb77"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "docforge-media"

# Public, non-sensitive defaults. Credentials and JWT_SECRET must be provided
# through .dev.vars locally and Cloudflare Secrets in production.
[vars]
SITE_TITLE = "DocForge"
SITE_DOMAIN = ""

[dev]
port = 8787
